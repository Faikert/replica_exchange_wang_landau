# Ordinary 2D nearest-neighbor antiferromagnetic Ising model, N = 16.
# E = +J * sum_<ij> sigma_i*sigma_j, J = 1; each bond counted once.
[geometry]
file = square_afm_4x4.csv
periodic = true
box_x = 4.0
box_y = 4.0
box_z = 0.0

[physics]
# With all easy axes along z and displacements in xy, retained bonds have J_ij = +1.
# 1 < cutoff < sqrt(2) keeps exactly four nearest neighbors per site (32 bonds).
coupling_scale = 1.0
cutoff = 1.01

[energy]
# Physical range [-32, 32]; center bins on multiples of 4, including both endpoints.
# Some levels (e.g. +/-28) are inaccessible and are discovered as empty by enumeration.
minimum = -34.0
maximum = 34.0
bin_width = 4.0
# The exporter requires every bin to be visited for complete_range=true.
# Structural zeros at +/-28 therefore require relative DOS output here.
complete_range = false

[parallel]
windows = 4
walkers_per_rank = 2
overlap = 0.75
exchange_interval_mcs = 10

[wl]
flatness = 0.8
minimum_visits = 100
final_factor = 1e-6
check_interval_mcs = 100
support_stability_checks = 10
inverse_time = false
force_accept_after_mcs = 0

[run]
seed = 12345
max_mcs = 1000000
temperatures = 0.5, 1.0, 1.5, 2.0, 2.2, 2.3, 2.5, 3.0, 4.0, 5.0

[output]
prefix = square_afm_4x4
