[geometry]
file = system_weighted.csv
periodic = true
box_x = 2.0
box_y = 2.0
box_z = 0.0

[physics]
coupling_scale = 1.0

[energy]
minimum = -8.0
maximum = 8.0
bin_width = 0.25
complete_range = false

[order_parameter]
mode = weighted_sum
bin_width = 1.0
support_stability_checks = 10

[parallel]
windows = 1
walkers_per_rank = 2
overlap = 0.75
exchange_interval_mcs = 10

[wl]
flatness = 0.8
minimum_visits = 100
final_factor = 1e-8
check_interval_mcs = 100
inverse_time = true

[run]
max_mcs = 1000000
temperatures = 0.5, 1.0, 2.0, 5.0

[output]
prefix = weighted_2d
