[geometry]
file = system.csv
periodic = true
box_x = 2.0
box_y = 2.0
box_z = 0.0

[physics]
coupling_scale = 1.0
cutoff = 5.0

[energy]
minimum = -8.0
maximum = 8.0
bin_width = 0.25
complete_range = false

[parallel]
windows = 8
walkers_per_rank = 1
overlap = 0.75
exchange_interval = 1000

[adaptive_windows]
enabled = false
iterations = 2
pilot_mcs = 10000
# The following widths are physical energy differences; zero selects an automatic value.
smoothing_width = 0
minimum_width = 0
diffusivity_floor_fraction = 0.05
curvature_weight = 0.25
round_trip_target = 2
maximum_round_trip_penalty = 3
round_trip_margin_fraction = 0.1

[wl]
flatness = 0.8
minimum_visits = 100
final_factor = 1e-8
check_interval = 10000

[run]
max_attempts = 10000000
checkpoint_interval = 1000000
temperatures = 0.5, 1.0, 2.0, 5.0

[output]
prefix = csv_ini_run
