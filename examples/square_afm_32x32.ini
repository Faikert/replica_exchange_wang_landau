# Ordinary 2D nearest-neighbor antiferromagnetic Ising model, N = 1024.
# E = +J * sum_<ij> sigma_i*sigma_j, J = 1; each bond counted once.
[geometry]
file = square_afm_32x32.csv
periodic = true
box_x = 32.0
box_y = 32.0
box_z = 0.0

[physics]
# With all easy axes along z and displacements in xy, retained bonds have J_ij = +1.
# 1 < cutoff < sqrt(2) keeps exactly four nearest neighbors per site (2048 bonds).
coupling_scale = 1.0
cutoff = 1.01

[energy]
# Physical range [-2048, 2048]; center bins on multiples of 4, including both endpoints.
# Levels +/-2044 are inaccessible: a single spin flip from an extremal state costs 8.
minimum = -2050.0
maximum = 2050.0
bin_width = 4.0
# The exporter requires every bin to be visited for complete_range=true.
# Structural zeros at +/-2044 therefore require relative DOS output here.
complete_range = false

[parallel]
windows = 4
walkers_per_rank = 2
overlap = 0.75
exchange_interval_mcs = 10

# Keep the target-search temperature near the single-flip energy scale.
# The default 0.05 scales too high with the extensive window widths at N=1024.
[initialization]
temperature_fraction = 0.001

[wl]
flatness = 0.8
minimum_visits = 100
final_factor = 1e-6
check_interval_mcs = 100
support_stability_checks = 10
inverse_time = false
force_accept_after_mcs = 0

[run]
progress = 1
seed = 12345
max_mcs = 1000000
temperatures = 0.5, 1.0, 1.5, 2.0, 2.2, 2.3, 2.5, 3.0, 4.0, 5.0

[output]
prefix = square_afm_32x32
